[project]
name = "singed-pipeline"
version = "0.1.0"
description = "The RAG Pipeline for Singed with Pgvector"
readme = "README.md"
authors = [
    { name = "Shawn", email = "shawnmgomez@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [    
    "pytest>=9.0.0",
    "fastapi>=0.141.1",
    "langchain-core>=1.5.4",
    "langchain-openai>=1.5.1",
    "langchain-postgres>=0.0.17",
    "langchain-text-splitters>=1.1.2",
    "psycopg>=3.3.4",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.52.4",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[project.scripts]
singed-pipeline = "singed_pipeline:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
